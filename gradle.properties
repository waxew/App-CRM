# تنظیمات سراسری Gradle برای W-CRM
# فعال‌سازی AndroidX برای تمام ماژول‌های اندرویدی پروژه.
android.useAndroidX=true

# مهاجرت خودکار کتابخانه‌های قدیمی support به AndroidX در صورت نیاز.
android.enableJetifier=true

# تنظیمات حافظه Gradle برای پایداری بهتر Build در CI و محیط توسعه.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# استفاده از Android Studio/Gradle استاندارد بدون نام‌گذاری قدیمی R class.
android.nonTransitiveRClass=true

# سبک رسمی کدنویسی Kotlin.
kotlin.code.style=official
